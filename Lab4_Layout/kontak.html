
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Layout Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">

        <header>
            <h1>Contact</h1>
        </header>

        <nav>
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="kontak.html" class="active">Contact</a>
        </nav>

        <section id="hero">
            <h1>Hubungi Saya</h1>
            <p>
                Silakan isi formulir berikut
                untuk mengirimkan pertanyaan atau pesan.
            </p>
        </section>

        <section id="main">
            <h2>Formulir Kontak</h2>

            <form>
                <label for="nama">Nama Lengkap:</label>
                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama lengkap"
                    required
                >

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Masukkan alamat email"
                    required
                >

                <label for="subjek">Subjek:</label>
                <input
                    type="text"
                    id="subjek"
                    name="subjek"
                    placeholder="Masukkan subjek pesan"
                >

                <label for="pesan">Pesan:</label>
                <textarea
                    id="pesan"
                    name="pesan"
                    rows="5"
                    placeholder="Tuliskan pesan kamu"
                    required
                ></textarea>

                <button type="submit">Kirim Pesan</button>
            </form>
        </section>

        <footer>
            <p>&copy; 2026 - Universitas Pelita Bangsa</p>
        </footer>

    </div>
</body>
</html>
